<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · NSAG</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Syne:wght@600;700&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--nsag:#4D45A8;--paper:#F6F3EC;--ink:#1C1B1F;--muted:#595667}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Manrope',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center}
  .wrap{max-width:520px}
  .mark{width:44px;height:44px;background:var(--nsag);border-radius:9px;color:#fff;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;line-height:44px;margin:0 auto 1.5rem}
  .code{font-family:'Syne',sans-serif;font-size:0.75rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--nsag);font-weight:700;margin-bottom:0.75rem}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:2.5rem;line-height:1.1;margin-bottom:1rem}
  p{color:var(--muted);line-height:1.7;font-size:1rem;margin-bottom:2rem}
  .links{display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap}
  a.btn{font-family:'Syne',sans-serif;font-weight:600;font-size:0.85rem;text-decoration:none;padding:0.7rem 1.4rem;border-radius:5px}
  a.solid{background:var(--nsag);color:#fff}
  a.ghost{border:1.5px solid var(--nsag);color:var(--nsag)}
</style>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234D45A8'/><text x='16' y='23' font-family='serif' font-size='20' font-weight='600' fill='white' text-anchor='middle'>N</text></svg>">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="canonical" href="https://nsag-site.vercel.app/404">
<meta property="og:title" content="Page not found · NSAG">
<meta property="og:image" content="https://nsag-site.vercel.app/og-image.png">
<meta name="description" content="This NSAG page could not be found. Browse the fifteen governance module scopes or the operations matrix instead.">
</head>
<body>
  <div class="wrap">
    <div class="mark">N</div>
    <div class="code">404 · Page not found</div>
    <h1>This page isn&rsquo;t here.</h1>
    <p>The link may be out of date, or the page has moved. Every part of the published NSAG framework is one click away from home. The fifteen module assessments are retired and are not available to take.</p>
    <div class="links">
      <a href="/" class="btn solid">Back to NSAG</a>
      <a href="/#modules" class="btn ghost">Browse the modules</a>
    </div>
  </div>
<script>try{fetch('https://nsag-api.vercel.app/api/pageview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:location.pathname}),keepalive:true})}catch(e){}</script>
</body>
</html>
