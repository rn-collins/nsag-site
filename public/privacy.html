    <h1 style="font-size:clamp(2rem,4vw,3rem);margin:1rem 0;">What we collect, and why.</h1>
    <p style="max-width:680px;opacity:0.9;font-size:1.1rem;line-height:1.7;">Plain language, no dark patterns. This page describes exactly how the free NSAG self-assessments and this site handle your information. Last reviewed 24 July 2026.</p>

<section>
  <div class="wrap" style="max-width:760px;">
    <h2 style="margin-bottom:0.5rem;">The free self-assessments</h2>
    <p style="color:var(--muted);line-height:1.8;margin-bottom:1.25rem;">Each module assessment runs in your browser. Your answers are used, on your device, to build your result — the maturity reflection, the dimension bands, and the PDF. Answering the questions does not, by itself, send anything to us.</p>
    <p style="color:var(--muted);line-height:1.8;margin-bottom:1.25rem;">At the end you can enter an email address to receive your result as a PDF and, if you choose, occasional NSAG updates. When you submit an email, your responses and result are sent to our system so we can generate and deliver that report and understand which modules institutions engage with. You can ask us to delete this at any time using the contact below.</p>
    <p style="color:var(--muted);line-height:1.8;margin-bottom:2rem;">We never sell your information and never share it with third parties for their own marketing. Email delivery is handled by our email provider solely to send your report.</p>

    <h2 style="margin-bottom:0.5rem;">What the result is — and isn't</h2>
    <p style="color:var(--muted);line-height:1.8;margin-bottom:2rem;">The assessments are educational self-reflections completed by one respondent. They are not validated psychometric indices, audits, accreditations, or clinical or diagnostic instruments, and results should not be read as a certified measurement of an institution. They are designed to show you where your governance is explicit and where to look next.</p>

    <h2 style="margin-bottom:0.5rem;">This website</h2>
    <p style="color:var(--muted);line-height:1.8;margin-bottom:2rem;">We record privacy-respecting, aggregate page-view counts to understand which pages are useful. We do not build advertising profiles. We decline non-essential tracking by default.</p>

    <h2 style="margin-bottom:0.5rem;">Sensitive topics</h2>
    <p style="color:var(--muted);line-height:1.8;margin-bottom:2rem;">Some modules ask about difficult institutional realities such as burnout, fairness, and discrimination. Your answers describe your perception of an institution's governance; they are not stored as claims about any named individual, and a low result is not an accusation of harm.</p>

    <h2 style="margin-bottom:0.5rem;">Your choices</h2>
    <p style="color:var(--muted);line-height:1.8;margin-bottom:2rem;">You can complete an assessment and read your result without giving us anything beyond the email needed to send the PDF. You can request a copy or deletion of anything associated with your email. For any privacy question, contact us using the details in the footer.</p>
  </div>
